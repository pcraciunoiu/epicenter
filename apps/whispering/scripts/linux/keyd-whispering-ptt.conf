# Swallow F13 from the Moonlander so GNOME does not also receive it.
# Install: sudo apt install keyd
#          sudo cp scripts/linux/keyd-whispering-ptt.conf /etc/keyd/whispering-ptt.conf
#          sudo systemctl enable keyd --now && sudo keyd reload
#
# Moonlander USB IDs — verify with:
#   cat /sys/class/input/event8/device/id/vendor
#   cat /sys/class/input/event8/device/id/product

[ids]
3297:1969

[main]
f13 = macro()
