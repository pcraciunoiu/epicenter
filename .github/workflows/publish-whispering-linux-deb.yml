name: Publish Whispering Linux DEB

# Fork-friendly workflow: builds only the Linux .deb package.
# No signing secrets required. Uses the built-in GITHUB_TOKEN to upload assets.

on:
  push:
    tags:
      - 'v*-alpha*'
      - 'v*-beta*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g., v7.12.0-alpha.1)'
        required: true
        type: string

jobs:
  publish-linux-deb:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libasound2-dev \
            libopenblas-dev \
            libopus-dev \
            libx11-dev \
            libxtst-dev \
            libxrandr-dev \
            build-essential \
            pkg-config \
            libssl-dev

      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-jammy.list https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-jammy.list
          sudo apt update
          sudo apt install -y vulkan-sdk mesa-vulkan-drivers

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./apps/whispering/src-tauri -> target

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend
        run: bun --filter @epicenter/whispering build

      - name: Process release notes
        id: release_notes
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          RELEASE_FILE="docs/release-notes/$TAG.md"
          if [ -f "$RELEASE_FILE" ]; then
            RELEASE_NOTES=$(cat "$RELEASE_FILE")
          else
            RELEASE_NOTES="Whispering $TAG (unofficial Linux build)."
          fi
          DELIMITER=$(openssl rand -hex 8)
          {
            echo "RELEASE_NOTES<<${DELIMITER}"
            echo "$RELEASE_NOTES"
            echo "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish Linux deb
        uses: tauri-apps/tauri-action@v0
        env:
          CI: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
        with:
          projectPath: apps/whispering
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Whispering ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: true
          args: --bundles deb --no-sign
